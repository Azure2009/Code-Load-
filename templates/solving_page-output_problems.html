{% extends 'base.html' %}

{% block head %} 



{% endblock %}

{% block body %}

    <div class="min-h-screen bg-slate-950 p-4">

        <div onclick="window.location.href='/case_problems' " class="flex w-fit mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
            class="lucide lucide-chevron-left-icon lucide-chevron-left bg-slate-800 text-slate-300 hover:-translate-x-[2.5px] transition-all duration-200"><path d="m15 18-6-6 6-6"/>
            </svg>
        </div>

        <div class="flex flex-col flex-1 justify-center items-center text-slate-500">

            <p class="text-yellow-600 text-3xl">{{problem.problem_title}}</p>
            <p>{{problem.problem_description}}</p>
            
            <pre>{{problem.problem_set | e}}</pre>
   
            <form action="/output_problems/solving_page/{{problem.problem_id}}" method='POST' class="flex flex-col">
                <textarea name='submission' rows="10" cols="50" class="resize-none border border-slate-500 p-2"></textarea>
                <input type="submit" value="Submit" class="mt-2 w-fit self-center cursor-pointer px-2 text-yellow-300 bg-yellow-800 hover:text-yellow-200">
            </form>

        </div>

    </div>

{% endblock %}
