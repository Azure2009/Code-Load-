{% extends 'base.html' %}

{% block head %} 

{% endblock %}

{% block body %}

    <div class="min-h-screen bg-slate-950 p-4">

        <div onclick="window.location.href='/output_problems' " class="flex w-fit mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
            class="lucide lucide-chevron-left-icon lucide-chevron-left bg-slate-800 text-slate-300 3xl:w-14 3xl:h-14 hover:-translate-x-[2.5px] transition-all duration-200"><path d="m15 18-6-6 6-6"/>
            </svg>
        </div>

        <div class="flex flex-col flex-1 text-slate-500 gap-y-4 mx-10">

            <p class="text-yellow-600 text-3xl 3xl:text-5xl flex justify-center">{{problem.problem_title}}</p>
                
            <div class="flex flex-col gap-8 items-center 3xl:text-3xl">
                <p>{{problem.problem_description}}</p>
                <pre>{{problem.problem_set | e}}</pre>
            </div>

            <form action="/output_problems/solving_page/{{problem.problem_id}}" method='POST' class="flex flex-col">
                <textarea name='submission' rows="10" cols="50" class="resize-none border border-slate-500 p-2 3xl:text-3xl focus:border-slate-400"></textarea>
                <input type="submit" value="Submit" class="mt-4 w-fit self-center cursor-pointer px-2 3xl:text-4xl text-yellow-300 bg-yellow-800 hover:text-yellow-200">
            </form>
    
        </div>

    </div>

{% endblock %}
