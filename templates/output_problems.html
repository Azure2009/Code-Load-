{% extends 'base.html' %}

{% block head %} 

{% endblock %}

{% block body %}
    <div class="min-h-screen bg-slate-200 p-4">
        <div onclick="window.location.href='/dashboard?fresh=true' " class="flex w-fit mb-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
            class="lucide lucide-chevron-left-icon lucide-chevron-left bg-white hover:-translate-x-2 transition-all duration-200"><path d="m15 18-6-6 6-6"/>
            </svg>
        </div>

        <div class="mx-10">
            <p class="text-5xl mb-2">Output Problems</p>
            <div class="flex flex-col gap-y-6 bg-white p-2">
                {% for problem in problems_list %}
                    <div class="flex flex-col bg-slate-200 p-2">                 
                        <p class="text-3xl">{{problem.problem_title}}</p>
                        <div class="flex items-center">
                            <p class="">
                                {{problem.difficulty}} • {{status_list[loop.index0]}}
                            </p>
                            <a href="/output_problems/solving-page/{{problem.problem_id}}?fresh=true" class="ml-auto bg-blue-500 text-white px-2">
                                Solve →
                            </a>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>

{% endblock %}
