{% extends 'admin/base.html' %}

{% block head %} 

{{ super() }} <!-- keeps the CSS link from base.html -->


{% endblock %}

{% block body %}

<div class="min-h-screen bg-slate-100 p-10">
    <div onclick="window.location.href='/admin/dashboard' " class="flex w-fit mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
        class="lucide lucide-chevron-left-icon lucide-chevron-left bg-white hover:-translate-x-2 transition-all duration-200"><path d="m15 18-6-6 6-6"/>
        </svg>
    </div>

    <div class="grid grid-cols-2 mx-10 divide-x-2 divide-dashed divide-yellow-300">
        <div class="flex flex-col gap-y-6 bg-yellow-500 p-4">

            <input type="hidden" value="" name="problem_id" id="problem_id">

            <p class="text-sm text-white italic">
                <span class="text-red-500 text-base">Delete</span> an output prediction exercise.
            </p>

            <div class="flex h-10 items-center">
                <input type="search" name="search_bar" id="search_bar" placeholder="Search problems..." autocomplete="off" class="border border-slate-300 px-2 focus:outline-white">                                                
                <div class="grid w-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
                    class="relative lucide lucide-trash2-icon lucide-trash-2 text-white bg-yellow-300 px-px ml-2"
                    onclick="delete_problem()"
                    >
                    <path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                </div>
            </div>
 
            <div id="results_panel"></div>
        </div> 

        <form action="/admin/dashboard/new_output_problem" method="POST" class="flex flex-col gap-y-4 p-4 bg-yellow-500 text-white">

            <input type="hidden" name="difficulty" id="difficulty" value="">
            <div class="flex items-center">
                <p class="italic text-base">
                    <span class="text-blue-500">Create</span> a new output prediction exercise.
                </p>
                <div class="flex ml-auto">
                    <p class="mr-2">Select difficulty:</p>
                    <div class="difficulty-btn">

                        <button type="button" onclick="select_difficulty(this)" data-value="Easy">Easy</button>
                        <button type="button" onclick="select_difficulty(this)" data-value="Medium">Medium</button>
                        <button type="button" onclick="select_difficulty(this)" data-value="Hard">Hard</button>

                    </div>
                </div>
            </div>

            <label for="problem_title">Problem Title:</label>
            <textarea name="problem_title" class="flex-1 border border-slate-300 p-2 resize-none focus:outline-white" required></textarea>

            <label for="problem_title">Problem Description:</label>
            <textarea name="problem_description" class="flex-1 border border-slate-300 p-2 resize-none focus:outline-white" required></textarea>
                
            <label for="coding_problem">Coding Problem</label>
            <textarea name="coding_problem" id="coding_problem" class="flex-1 border border-slate-300 p-2 resize-none focus:outline-white" required></textarea>

            <label for="expected_output">Expected Output</label>
            <textarea name="expected_output" id="expected_output" class="flex-1 border border-slate-300 p-2 resize-none focus:outline-white" required></textarea>

            
            <input type="submit" value="Submit" class="w-fit bg-yellow-400 text-white px-10 py-1 self-center hover:bg-yellow-300 transition-all duration-200">
        </form>
    </div>
</div>

<script>

let selectedProblemId = null

function select_difficulty(btn) {

    document.querySelectorAll(".difficulty-btn button").forEach(b => {

        b.classList.remove('active')

    })

    btn.classList.add('active')

    document.getElementById("difficulty").value = btn.dataset.value


}

function delete_problem() {

    const problem_id_raw = document.getElementById("problem_id").value

    if (!problem_id_raw) {

        alert('No problem was selected.')

        return 

    }
    
    const confirmed = confirm('Are you sure you want to delete this output problem?')

    if (confirmed) {

        window.location.href = `/admin/dashboard/new_output_problem/delete/${problem_id_raw}`

    }

}

function render(results) {

    const panel = document.getElementById('results_panel');

    if (results.length === 0) {

        panel.style.display = 'none';
        return;

    }

    panel.style.display = 'block';

    panel.innerHTML = results.map(item =>

        `<div 
        id="${item.id}" 
        onclick="toggle(this)"
        style="padding: 8px; cursor: pointer; display: block; background-color: ${item.id == selectedProblemId ? '#d0ebff' : ''}">
        ${item.title}
        </div>`

    ).join('');

}

function toggle(div) {

    document.querySelectorAll('#results_panel div').forEach(d => {

        d.style.backgroundColor = '';

    });

    div.style.backgroundColor = '#894b00';

    selectedProblemId = div.id;

    document.getElementById('problem_id').value = selectedProblemId;

}

document.getElementById('search_bar').addEventListener('input', async i => {

    const query = i.target.value;

    const response = await fetch(`/admin/dashboard/new_output_problem/search?q=${query}`);

    const result = await response.json();

    render(result);
})

</script>

{% endblock %}
